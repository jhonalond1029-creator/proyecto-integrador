<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="img/png" href="assets/favicon/favicon-96x96.png">
    <title>RegisColegio</title>
    <link rel="stylesheet" href="css/login.css">
    <link rel="stylesheet" href="css/responsive.css">
     <script src="js/validacion_usuario.js" defer></script>
    <script src="js/login.js" defer></script>

</head>
<body>
    
    <main class="login">

        <form id="form-login" class="login-tarjeta" novalidate>

            <section class="logo">
                <img src="assets/img/logo.png" alt="logo">
            </section>
            <h1>Iniciar Sesion</h1>

            <section class="campo">
                <img src="assets/img/usuario.png" alt="" class="campo-icono">
                <input type="text" id="login-usuario" placeholder="Ingrese su usuario" required>
            </section>

            <section class="campo">
                <input type="password" id="login-contrasena" placeholder="Contraseña" required>
                <button type="button" id="btn-ver-contrasena" class="campo-ojo" aria-label="Mostrar contraseña">
                    <img src="assets/img/ojo.png" alt="">
                </button>
            </section>

            <a href="#" id="recuperar" class="enlace-chico">¿Olvidaste tu contrasena?</a>

            <p id="login-mensaje" class="mensaje" role="alert"></p>

            <button type="submit" id="btn-login" class="btn btn-primario">
                Iniciar Sesion
            </button>

            <a href="registro.html" class="btn btn-secundario">Registrarse</a>

        </form>

    </main>

   
    
</body>
</html>
